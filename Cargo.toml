[package]
name = "whisper_flow_rust"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = ["whisper-rs/cuda"]

[dependencies]
dotenvy = "0.15"
tokio = { version = "1.38", features = ["full"] }
cpal = "0.15"
whisper-rs = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rdev = "0.5"
arboard = "3.4"
eframe = "0.27"
egui = "0.27"
rfd = "0.13"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(not(windows))'.dependencies]
fs2 = "0.4"

