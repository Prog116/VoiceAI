name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev libgtk-3-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev pkg-config
      - name: Format check
        run: cargo fmt --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true
      - name: Build (CPU)
        run: cargo build --release
      - name: Test
        run: cargo test
